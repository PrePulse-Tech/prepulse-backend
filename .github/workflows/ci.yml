# CI pipeline: checks that no secrets are committed, and that the backend builds,
# follows the code style and passes the tests.
# The name is shown in the "Actions" tab and on pull requests.
name: CI

# When the pipeline runs.
on:
  pull_request:          # on every pull request, regardless of target branch
  push:
    branches: [main]     # and when something is merged/pushed into main

# Least privilege: the workflow may only read the repo, not write to it.
permissions:
  contents: read

# If a new commit is pushed while an older run is still going on the same branch,
# the old run is cancelled so we only wait for the newest one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Secrets, build, lint & test   # the check name shown on the PR
    runs-on: ubuntu-latest       # GitHub starts a fresh Linux machine for every run
    steps:
      # Download the repo's code onto the machine.
      # fetch-depth: 0 fetches the full git history, so gitleaks can scan every commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SECURITY: scan the whole git history for committed secrets (API keys, passwords, tokens).
      # The pipeline fails if anything is found. We use the gitleaks CLI directly, because
      # gitleaks-action requires a paid license for organization repos.
      # The download is verified against the official checksum file before it is used.
      - name: Security - gitleaks secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum --check -
          tar -xzf "$file" gitleaks
          ./gitleaks git --redact --verbose .

      # Install Python 3.13 and cache pip downloads, so later runs are faster.
      # The cache is rebuilt when a requirements file changes.
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # BUILD 1/2: install the app's dependencies plus the dev tools (pytest, httpx, ruff).
      - name: Build - install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # BUILD 2/2: check that the app can be imported, which catches syntax errors
      # and missing packages before the tests run.
      - name: Build - verify app imports
        run: python -c "import app.main"

      # LINT 1/2: ruff looks for errors and bad practice (unused imports, typical bugs, etc.).
      - name: Lint - ruff check
        run: ruff check .

      # LINT 2/2: check that the code is formatted correctly. It only checks and changes nothing.
      # Fix locally with: ruff format .
      - name: Lint - ruff format
        run: ruff format --check .

      # TEST: run all the tests in tests/. If a single one fails, the pipeline turns red.
      - name: Test - pytest
        run: pytest -v
